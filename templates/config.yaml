# Cortex Project Configuration
# Generated by cortex-setup. Edit to match your project.

engine:
  path: "{{ENGINE_PATH}}"
  version: "{{ENGINE_VERSION}}"

# Per-machine overrides belong in .cortex/config.local.yaml, which should be
# ignored by VCS. Example:
# engine:
#   path: "C:/Path/To/This/Machine/UE"

# Active domains (based on enabled UnrealCortex modules)
domains:
{{DOMAINS}}

# References to project documentation
# Agents read these files when working on related tasks
references:
  # game_design: docs/design/gdd.md
  # quest_system: docs/design/quests.md
  # combat_spec: docs/design/combat.md

# Agent hooks are opt-in and disabled by default. Uncomment to enable; see the
# toolkit README "Agent Hooks (opt-in)" section.
# hooks:
#   editor_guard: false     # PreToolUse: check/launch the Unreal Editor before cortex_mcp calls
#   session_context: false  # SessionStart: inject .cortex context into the session
